[project]
name = "savat"
version = "1.1.1"
description = "Audio-visual action spotting with reliability-aware fusion and contrastive alignment"
readme = "README.md"
authors = [{ name = "Lazhar Bouacha", email = "bouacha.lazhar@icloud.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["audio-visual", "action-spotting", "sports", "multimodal", "contrastive-learning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "av>=12.1.0,<13",
  "numpy>=2.2.0",
  "pyyaml>=6.0",
  "torch>=2.8,<2.14",
  "torchaudio>=2.8,<2.14",
  "torchvision>=0.23,<0.29",
  "tqdm>=4.66.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
savat-train = "savat.train:main"
savat-evaluate = "savat.evaluate:main"
savat-robustness = "savat.robustness:main"
savat-linear-probe = "savat.linear_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savat"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
